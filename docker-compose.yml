  datamaster-service:
    depends_on: [db, redis, mongodb]
    container_name: datamaster-service
    image: opensimrs/datamaster-service:v1.0.0
    build:
      context: .
      dockerfile: datamaster-service/Dockerfile
    env_file:
      - .env
    networks: [opensimrs]
    restart: always
    ports: ["8096:8096"]
  db:
    container_name: opensimrs-db
    ports: ["5432:5432"]
    image: postgres:16-alpine
    volumes:
      - type: volume
        source: opensimrs-db
        target: /var/lib/postgresql
      # Skema dasar + data referensi nasional; dimuat sekali saat volume masih kosong.
      - type: bind
        source: ./schema.sql
        target: /docker-entrypoint-initdb.d/schema.sql
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks: [opensimrs]
  mongodb:
    container_name: opensimrs-mongodb
    image: mongo:latest
    ports: ["27017:27017"]
    volumes:
      - type: volume
        source: opensimrs-mongodb
        target: /data/db
      - type: bind
        source: ./mongo-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
    restart: always
    networks: [opensimrs]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB_AUTH_SOURCE}

  redis:
    container_name: opensimrs-redis
    image: redis:7.0.11-alpine
    ports: ["6379:6379"]
    volumes:
      - type: volume
        source: opensimrs-redis
        target: /data
      - type: bind
        source: ./redis.conf
        target: /usr/local/etc/redis/redis.conf
    restart: always
    networks: [opensimrs]

volumes:
  opensimrs-db: {}
  opensimrs-mongodb: {}
  opensimrs-redis: {}
networks:
  opensimrs:
    driver: bridge