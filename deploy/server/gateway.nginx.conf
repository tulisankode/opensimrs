# API gateway OpenSIMRS: satu port/domain → layanan berdasarkan awalan path.
# Contoh: https://api.simrs.contoh.id → host :8080 → container gateway :80.
# Resolver Docker + variabel upstream: gateway tetap start walau salah satu service belum siap.

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 25m;
  proxy_read_timeout 120s;
  proxy_connect_timeout 5s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;

  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }

  location ^~ /api/v3/auth/        { set $up auth-service:8083;          proxy_pass http://$up; }
  location ^~ /api/v3/admisi/      { set $up admisi-service:8081;        proxy_pass http://$up; }
  location ^~ /api/v3/antrian/     { set $up antrian-service:8082;       proxy_pass http://$up; }
  location ^~ /api/v3/farmasi/     { set $up farmasi-service:8084;       proxy_pass http://$up; }
  location ^~ /api/v3/pelayanan/   { set $up igd-service:8085;           proxy_pass http://$up; }
  location ^~ /api/v3/inventory/   { set $up inventory-service:8086;     proxy_pass http://$up; }
  location ^~ /api/v3/lab/         { set $up lab-service:8087;           proxy_pass http://$up; }
  # adamLIS mengirim hasil ke SIMRS (kunci masuk per koneksi LIS, bukan token login)
  location ^~ /adam-lis/           { set $up lab-service:8087;           proxy_pass http://$up; client_max_body_size 5m; }
  location ^~ /api/v3/laporan/     { set $up laporan-service:8088;       proxy_pass http://$up; }
  location ^~ /api/v3/payment/     { set $up payment-service:8089;       proxy_pass http://$up; }
  location ^~ /api/v3/ranap/       { set $up rawat-inap-service:8091;    proxy_pass http://$up; }
  location ^~ /api/v3/rajal/       { set $up rawat-jalan-service:8092;   proxy_pass http://$up; }
  location ^~ /api/v3/rekam-medis/ { set $up rekamedis-service:8093;     proxy_pass http://$up; }
  location ^~ /api/v3/satusehat/  { set $up satusehat-service:8097;     proxy_pass http://$up; }
  location ^~ /api/v3/bpjs/       { set $up bpjs-service:8098;          proxy_pass http://$up; }
  location ^~ /api/v3/penunjang/  { set $up penunjang-service:8099;     proxy_pass http://$up; }
  location ^~ /api/v3/setting/     { set $up setting-service:8094;       proxy_pass http://$up; }
  location ^~ /api/v3/stok/        { set $up stok-farmasi-service:8095;  proxy_pass http://$up; }
  location ^~ /api/v3/datamaster/  { set $up datamaster-service:8096;    proxy_pass http://$up; }

  location / { default_type application/json; return 404 '{"message":"Endpoint tidak ditemukan"}'; }
}
