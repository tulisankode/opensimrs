# CI OpenSIMRS: cek sintaks semua layanan Node.js, uji unit, uji migrasi ke Postgres kosong,
# cek dokumen katalog modul, dan build frontend.
name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opensimrs
          POSTGRES_PASSWORD: opensimrs
          POSTGRES_DB: opensimrs
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opensimrs" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek sintaks JavaScript semua layanan & SDK
        run: |
          fail=0
          for f in $(git ls-files '*-service/src/*.js' '*-service/src/**/*.js' 'packages/**/*.js' | grep -v '^frontend-service/'); do
            node --check "$f" 2>/dev/null || { echo "Sintaks error: $f"; node --check "$f" || true; fail=1; }
          done
          exit $fail
      - name: Uji unit (lab-service)
        working-directory: lab-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Uji unit (studio-service)
        working-directory: studio-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Uji unit (laporan-service, validator ekstensi)
        working-directory: laporan-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Uji unit (setting-service, penyaring Helpdesk & katalog modul)
        working-directory: setting-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Uji unit (penunjang-service, CSSD)
        working-directory: penunjang-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Uji unit (program-puskesmas-service)
        working-directory: program-puskesmas-service
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Muat schema.sql + jalankan migrasi
        env:
          PGPASSWORD: opensimrs
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: opensimrs
          DB_USERNAME: opensimrs
          DB_PASSWORD: opensimrs
        run: |
          psql -h 127.0.0.1 -U opensimrs -d opensimrs -v ON_ERROR_STOP=1 -q -f schema.sql
          npm ci --no-audit --no-fund --ignore-scripts
          npx sequelize-cli db:migrate
          npx sequelize-cli db:migrate   # idempoten: kedua kali tidak boleh mengubah apa pun
      - name: Dokumen katalog modul sinkron dengan katalog-modul.json
        run: node scripts/dokumen-katalog.mjs --cek
      - name: Integritas lintas berkas (rute katalog, menu navbar, migrasi, import @/main)
        run: node scripts/cek-integritas.mjs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: frontend-service
      - run: npm run build-only
        working-directory: frontend-service
